name: Release

# Push a tag like v0.2.0 to build the download-and-run zips for Windows,
# macOS and Linux and attach them to a GitHub Release.
# "Run workflow" builds the same zips as artifacts without making a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      # The release build needs node --build-sea (Node 25.5 or newer).
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build:release

      - uses: actions/upload-artifact@v6
        with:
          name: scorebug-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          generate_release_notes: true
