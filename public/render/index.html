<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ScoreBug renderer</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      #stage > * {
        position: absolute;
        inset: 0;
        display: block;
      }
      #error {
        position: absolute;
        left: 24px;
        top: 24px;
        padding: 12px 16px;
        font: 16px system-ui, sans-serif;
        color: #fff;
        background: #b91c1c;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
